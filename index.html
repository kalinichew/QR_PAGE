<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101116">
  <title>Колесо скидок</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #101116;
      color: #f7f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      background: radial-gradient(ellipse at 50% -30%, #39324f 0, transparent 55%), #101116;
    }

    button { font: inherit; }

    .page {
      width: min(100%, 1080px);
      margin: 0 auto;
      padding: 18px 20px 48px;
    }

    .video-frame {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 1px solid #ffffff1c;
      border-radius: 22px;
      background: #000;
      box-shadow: 0 22px 70px #0007;
    }

    #rickroll {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-action {
      position: absolute;
      z-index: 2;
      border: 1px solid #ffffff38;
      border-radius: 999px;
      background: #15161dcc;
      color: #fff;
      box-shadow: 0 8px 24px #0006;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    #sound-btn {
      top: max(14px, env(safe-area-inset-top));
      right: 14px;
      padding: 11px 16px;
    }

    #start-btn {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 22px;
      background: #7758e8ed;
      font-weight: 700;
    }

    .video-action[hidden] { display: none; }

    .roulette {
      display: flex;
      min-height: 300px;
      align-items: center;
      justify-content: center;
      padding: 34px 0;
    }

    #spin-btn {
      min-width: 240px;
      padding: 17px 30px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #987aff, #6846df);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 10px 30px #6846df55;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    #spin-btn:hover:not(:disabled) { transform: translateY(-2px); }
    #spin-btn:disabled { cursor: wait; opacity: 0.72; }
    #spin-btn[hidden] { display: none; }

    .reel-stage {
      position: relative;
      width: 100%;
      padding: 20px 0;
    }

    .reel-stage[hidden],
    .winner-card[hidden] { display: none; }

    .reel-viewport {
      overflow: hidden;
      width: 100%;
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }

    .reel-track {
      display: flex;
      width: max-content;
      gap: 14px;
      transition: transform 5.2s cubic-bezier(0.08, 0.72, 0.12, 1);
      will-change: transform;
    }

    .reel-card {
      display: flex;
      flex: 0 0 clamp(238px, 72vw, 300px);
      min-height: 190px;
      flex-direction: column;
      align-items: flex-start;
      padding: 20px;
      border: 1px solid #ffffff22;
      border-radius: 20px;
      background: radial-gradient(circle at 100% 0, var(--glow), transparent 48%), #20212a;
      text-align: left;
    }

    .reel-card__number {
      display: inline-flex;
      min-width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      border-radius: 50%;
      background: var(--glow);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .reel-card__name { margin: 0 0 7px; font-size: 1.1rem; }
    .reel-card__description { margin: 0; color: #c6c6d0; font-size: 0.88rem; line-height: 1.4; }
    .reel-card__code { margin-top: auto; padding-top: 15px; color: #b8a9ff; font-size: 0.8rem; font-weight: 700; }

    .reel-marker {
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      border-radius: 3px;
      background: #bcaeff;
      box-shadow: 0 0 18px #9f83ffb3;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .reel-marker::before,
    .reel-marker::after {
      position: absolute;
      left: 50%;
      width: 0;
      height: 0;
      border-right: 9px solid transparent;
      border-left: 9px solid transparent;
      content: "";
      transform: translateX(-50%);
    }

    .reel-marker::before { top: 0; border-top: 12px solid #bcaeff; }
    .reel-marker::after { bottom: 0; border-bottom: 12px solid #bcaeff; }

    .winner-card {
      width: min(100%, 560px);
      padding: clamp(24px, 5vw, 38px);
      border: 1px solid #a693ff65;
      border-radius: 24px;
      background: radial-gradient(circle at 100% 0, #8a68ff27, transparent 45%), #1b1b24;
      box-shadow: 0 20px 60px #0005;
      text-align: left;
      animation: winner-in 360ms ease-out both;
    }

    @keyframes winner-in {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .winner-card__label {
      margin: 0 0 10px;
      color: #b7a8ff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .winner-card h1 {
      margin: 0;
      font-size: clamp(1.7rem, 6vw, 2.4rem);
      line-height: 1.1;
    }

    .winner-card__title {
      margin: 13px 0 0;
      color: #f0ecff;
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .winner-card__description {
      margin: 8px 0 22px;
      color: #d0cfda;
      line-height: 1.55;
    }

    #spin-again-btn {
      width: 100%;
      margin-top: 16px;
    }

    .winner-card__code-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid #ffffff18;
      border-radius: 14px;
      background: #111218;
    }

    .winner-card__code {
      flex: 1;
      min-width: 120px;
      overflow-wrap: anywhere;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.09em;
    }

    .winner-card__action {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 10px 15px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #987aff, #6846df);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .winner-card__action[hidden] { display: none; }

    #copy-status {
      min-height: 1.3em;
      margin: 10px 0 0;
      color: #b7a8ff;
      font-size: 0.88rem;
    }

    @media (max-width: 540px) {
      .page { padding: 10px 12px 32px; }
      .video-frame { border-radius: 15px; }
      #sound-btn { top: 9px; right: 9px; padding: 9px 12px; font-size: 0.85rem; }
      .roulette { min-height: 250px; }
      .reel-card { min-height: 204px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="video-frame" aria-label="Видео">
      <video id="rickroll" controls autoplay muted playsinline webkit-playsinline>
        <source src="video.mp4" type="video/mp4">
        Ваш браузер не поддерживает видео.
      </video>
      <button id="start-btn" class="video-action" type="button" hidden>Запустить видео</button>
      <button id="sound-btn" class="video-action" type="button" aria-pressed="false">Включить звук</button>
    </section>

    <section class="roulette" aria-label="Рулетка промокодов">
      <button id="spin-btn" type="button" disabled>Загружаем предложения…</button>

      <div class="reel-stage" id="reel-stage" hidden>
        <div class="reel-viewport" id="reel-viewport">
          <div class="reel-track" id="reel-track"></div>
        </div>
        <div class="reel-marker" aria-hidden="true"></div>
      </div>

      <article class="winner-card" id="winner-card" aria-live="polite" hidden>
        <p class="winner-card__label">Тебе выпало</p>
        <h1 id="winner-name"></h1>
        <p class="winner-card__title" id="winner-title"></p>
        <p class="winner-card__description" id="winner-description"></p>
        <div class="winner-card__code-row">
          <code class="winner-card__code" id="winner-code"></code>
          <button class="winner-card__action" id="copy-btn" type="button">Скопировать</button>
          <a class="winner-card__action" id="source-link" target="_blank" rel="noopener noreferrer" hidden>Открыть Pepper</a>
        </div>
        <button class="winner-card__action" id="spin-again-btn" type="button">Крутить ещё</button>
        <p id="copy-status" role="status"></p>
      </article>
    </section>
  </main>

  <script>
    const video = document.getElementById('rickroll');
    const startButton = document.getElementById('start-btn');
    const soundButton = document.getElementById('sound-btn');
    const spinButton = document.getElementById('spin-btn');
    const reelStage = document.getElementById('reel-stage');
    const reelViewport = document.getElementById('reel-viewport');
    const reelTrack = document.getElementById('reel-track');
    const winnerCard = document.getElementById('winner-card');
    const winnerName = document.getElementById('winner-name');
    const winnerTitle = document.getElementById('winner-title');
    const winnerDescription = document.getElementById('winner-description');
    const spinAgainButton = document.getElementById('spin-again-btn');
    const winnerCode = document.getElementById('winner-code');
    const copyButton = document.getElementById('copy-btn');
    const sourceLink = document.getElementById('source-link');
    const copyStatus = document.getElementById('copy-status');

    let offers = [];
    let selectedOffer = null;

    function isSafePepperUrl(value) {
      if (!value) return '';
      try {
        const url = new URL(value, window.location.href);
        const host = url.hostname.toLowerCase();
        return url.protocol === 'https:' && (host === 'pepper.ru' || host.endsWith('.pepper.ru')) ? url.href : '';
      } catch (error) {
        return '';
      }
    }

    function normalizeOffer(offer) {
      if (!offer || offer.active === false || offer.isExpired === true) return null;
      if (offer.expiresAt && Date.parse(offer.expiresAt) <= Date.now()) return null;

      const name = String(offer.merchant || offer.name || offer.store || '').trim();
      const title = String(offer.title || offer.description || '').trim();
      const description = String(offer.description || offer.title || '').trim();
      const code = String(offer.code || offer.voucherCode || '').trim();
      if (!name || !title || !description || !code) return null;

      return {
        name: name,
        title: title,
        description: description,
        code: code,
        sourceUrl: isSafePepperUrl(offer.sourceUrl || offer.source_url || offer.url),
        color: typeof offer.color === 'string' ? offer.color : '#8a72e8'
      };
    }

    async function loadOffers() {
      spinButton.disabled = true;
      spinButton.textContent = 'Загружаем предложения…';

      try {
        const response = await fetch('./offers.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Не удалось загрузить предложения');
        const payload = await response.json();
        const list = Array.isArray(payload) ? payload : payload.offers;
        offers = Array.isArray(list) ? list.map(normalizeOffer).filter(Boolean) : [];
        if (!offers.length) throw new Error('Нет доступных предложений');
        spinButton.disabled = false;
        spinButton.textContent = 'Крутить рулетку';
      } catch (error) {
        offers = [];
        spinButton.disabled = false;
        spinButton.textContent = 'Повторить загрузку';
      }
    }

    function makeCard(offer, number) {
      const card = document.createElement('article');
      card.className = 'reel-card';
      card.style.setProperty('--glow', offer.color);

      const badge = document.createElement('span');
      badge.className = 'reel-card__number';
      badge.textContent = String(number);

      const name = document.createElement('h2');
      name.className = 'reel-card__name';
      name.textContent = offer.name;

      const description = document.createElement('p');
      description.className = 'reel-card__description';
      description.textContent = offer.title || offer.description;

      const code = document.createElement('span');
      code.className = 'reel-card__code';
      code.textContent = 'ПРОМОКОД · ' + offer.code;

      card.append(badge, name, description, code);
      return card;
    }

    function showWinner(offer) {
      selectedOffer = offer;
      winnerName.textContent = offer.name;
      winnerTitle.textContent = offer.title;
      winnerDescription.textContent = offer.description;
      winnerCode.textContent = offer.code;
      copyStatus.textContent = '';
      sourceLink.href = offer.sourceUrl || '';
      sourceLink.hidden = !offer.sourceUrl;
      reelStage.hidden = true;
      winnerCard.hidden = false;
    }

    function startSpin() {
      if (!offers.length) {
        loadOffers();
        return;
      }

      const winnerIndex = Math.floor(Math.random() * offers.length);
      selectedOffer = offers[winnerIndex];
      const landingIndex = 46;
      const sequence = Array.from(
        { length: landingIndex },
        () => offers[Math.floor(Math.random() * offers.length)]
      );
      sequence.push(selectedOffer);

      reelTrack.replaceChildren(...sequence.map((offer, index) => makeCard(offer, index + 1)));
      reelTrack.style.transition = 'none';
      reelTrack.style.transform = 'translateX(0)';
      reelStage.hidden = false;
      winnerCard.hidden = true;
      spinButton.hidden = true;
      reelViewport.scrollLeft = 0;

      // Принудительно применяем начальную позицию перед запуском CSS-перехода.
      void reelTrack.offsetWidth;

      const winnerTile = reelTrack.children[landingIndex];
      const distance = winnerTile.offsetLeft + winnerTile.offsetWidth / 2 - reelViewport.clientWidth / 2;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let finished = false;
      let fallbackTimer;

      function finish() {
        if (finished) return;
        finished = true;
        clearTimeout(fallbackTimer);
        showWinner(selectedOffer);
      }

      if (reducedMotion) {
        finish();
        return;
      }

      requestAnimationFrame(() => {
        reelTrack.style.transition = '';
        reelTrack.style.transform = 'translateX(-' + distance + 'px)';
      });

      reelTrack.addEventListener('transitionend', function onEnd(event) {
        if (event.propertyName !== 'transform') return;
        reelTrack.removeEventListener('transitionend', onEnd);
        finish();
      });

      fallbackTimer = window.setTimeout(finish, 5700);
    }

    video.muted = true;
    video.defaultMuted = true;

    video.addEventListener('play', () => {
      startButton.hidden = true;
    });

    video.play().catch(() => {
      startButton.hidden = false;
    });

    startButton.addEventListener('click', async () => {
      video.muted = true;
      try {
        await video.play();
        startButton.hidden = true;
      } catch (error) {
        // Кнопка остаётся доступной для повторной попытки.
      }
    });

    soundButton.addEventListener('click', async () => {
      const enableSound = video.muted;
      video.muted = !enableSound;
      video.volume = 1;
      soundButton.textContent = enableSound ? 'Выключить звук' : 'Включить звук';
      soundButton.setAttribute('aria-pressed', String(enableSound));

      try {
        await video.play();
        startButton.hidden = true;
      } catch (error) {
        video.muted = true;
        soundButton.textContent = 'Включить звук';
        soundButton.setAttribute('aria-pressed', 'false');
      }
    });

    spinButton.addEventListener('click', () => {
      if (!offers.length) {
        loadOffers();
        return;
      }
      startSpin();
    });

    spinAgainButton.addEventListener('click', startSpin);

    copyButton.addEventListener('click', async () => {
      if (!selectedOffer) return;

      try {
        await navigator.clipboard.writeText(selectedOffer.code);
        copyStatus.textContent = 'Промокод скопирован.';
      } catch (error) {
        const field = document.createElement('textarea');
        field.value = selectedOffer.code;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.append(field);
        field.select();
        const copied = document.execCommand('copy');
        field.remove();
        copyStatus.textContent = copied ? 'Промокод скопирован.' : 'Код: ' + selectedOffer.code;
      }
    });

    loadOffers();
  </script>
</body>
</html>
