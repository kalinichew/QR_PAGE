<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Приветик</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #main-content {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #rickroll {
      position: relative;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #light-show {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .action-btn {
      position: absolute;
      z-index: 2;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: #23a6d5;
      color: #fff;
      box-shadow: 0 4px 24px #0008;
      font: inherit;
      font-size: clamp(1rem, 4vw, 1.25rem);
      cursor: pointer;
    }

    #sound-btn {
      bottom: max(24px, env(safe-area-inset-bottom));
    }

    #start-btn {
      top: 50%;
      bottom: auto;
      transform: translate(-50%, -50%);
    }

    .action-btn[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      #light-show {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main id="main-content">
    <video id="rickroll" controls autoplay muted playsinline webkit-playsinline>
      <source src="video.mp4" type="video/mp4">
      Ваш браузер не поддерживает видео.
    </video>
    <canvas id="light-show" aria-hidden="true"></canvas>
    <button id="start-btn" class="action-btn" type="button" hidden>Запустить видео</button>
    <button id="sound-btn" class="action-btn" type="button">Включить звук</button>
  </main>

  <script>
    const video = document.getElementById('rickroll');
    const lightShow = document.getElementById('light-show');
    const startButton = document.getElementById('start-btn');
    const soundButton = document.getElementById('sound-btn');
    const context = lightShow.getContext('2d');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Явно отключаем звук до попытки запуска: это необходимо для автозапуска в Safari на iPhone.
    video.muted = true;
    video.defaultMuted = true;

    function resizeLightShow() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      lightShow.width = Math.round(window.innerWidth * pixelRatio);
      lightShow.height = Math.round(window.innerHeight * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function drawGlow(x, y, radius, color, strength) {
      const glow = context.createRadialGradient(x, y, 0, x, y, radius);
      glow.addColorStop(0, `hsla(${color}, 100%, 62%, ${strength})`);
      glow.addColorStop(1, `hsla(${color}, 100%, 62%, 0)`);
      context.fillStyle = glow;
      context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    let animationFrame = null;

    function animateLights() {
      animationFrame = null;

      const width = window.innerWidth;
      const height = window.innerHeight;
      context.clearRect(0, 0, width, height);

      if (video.paused || video.ended || prefersReducedMotion) {
        return;
      }

      // Клип — Rick Astley, "Never Gonna Give You Up" (примерно 113 ударов в минуту).
      // Пульс привязан к времени самого видео, поэтому свет не расходится с воспроизведением.
      const beatLength = 60 / 113;
      const beatPosition = (video.currentTime % beatLength) / beatLength;
      const pulse = Math.pow(Math.max(0, 1 - beatPosition / 0.72), 2);
      const beatNumber = Math.floor(video.currentTime / beatLength);
      const hue = (beatNumber * 47 + 185) % 360;
      const strength = 0.38 * pulse;

      context.globalCompositeOperation = 'screen';
      drawGlow(width * 0.08, height * 0.52, Math.max(width, height) * 0.48, hue, strength);
      drawGlow(width * 0.92, height * 0.48, Math.max(width, height) * 0.48, (hue + 115) % 360, strength);
      drawGlow(width * 0.5, height * 0.02, Math.max(width, height) * 0.34, (hue + 235) % 360, strength * 0.55);
      context.globalCompositeOperation = 'source-over';

      animationFrame = window.requestAnimationFrame(animateLights);
    }

    function clearLights() {
      if (animationFrame !== null) {
        window.cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', resizeLightShow);
    video.addEventListener('play', () => {
      // Скрываем запасную кнопку, даже если пользователь запустил видео штатными элементами плеера.
      startButton.hidden = true;
      if (!prefersReducedMotion && animationFrame === null) {
        animateLights();
      }
    });
    video.addEventListener('pause', clearLights);
    video.addEventListener('ended', clearLights);

    resizeLightShow();

    video.play().catch(() => {
      // iOS может запретить автозапуск, например, в режиме энергосбережения.
      // В таком случае показываем кнопку, запускающую видео без звука по нажатию.
      startButton.hidden = false;
    });

    startButton.addEventListener('click', async () => {
      video.muted = true;

      try {
        await video.play();
        startButton.hidden = true;
      } catch (error) {
        // Оставляем кнопку на экране, если браузер всё ещё не смог начать воспроизведение.
      }
    });

    soundButton.addEventListener('click', async () => {
      video.muted = false;
      video.volume = 1;

      try {
        await video.play();
        startButton.hidden = true;
        soundButton.hidden = true;
      } catch (error) {
        // Оставляем кнопку включения звука доступной для повторной попытки.
        video.muted = true;
      }
    });
  </script>
</body>
</html>
