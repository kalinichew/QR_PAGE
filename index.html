<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Приветик</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #main-content {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    #rickroll {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #sound-btn {
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: #23a6d5;
      color: #fff;
      box-shadow: 0 4px 24px #0008;
      font: inherit;
      font-size: clamp(1rem, 4vw, 1.25rem);
      cursor: pointer;
    }

    #sound-btn[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main id="main-content">
    <video id="rickroll" controls autoplay muted playsinline>
      <source src="video.mp4" type="video/mp4">
      Ваш браузер не поддерживает видео.
    </video>
    <button id="sound-btn" type="button">Включить звук</button>
  </main>

  <script>
    const video = document.getElementById('rickroll');
    const soundButton = document.getElementById('sound-btn');

    // Запускаем видео без звука: браузеры обычно разрешают такой автозапуск.
    video.play().catch(() => {
      // Если автозапуск запрещён, пользователь сможет запустить видео через элементы плеера.
    });

    soundButton.addEventListener('click', async () => {
      video.muted = false;
      video.volume = 1;

      try {
        await video.play();
        soundButton.hidden = true;
      } catch (error) {
        // Оставляем кнопку видимой, чтобы пользователь мог попробовать ещё раз.
        video.muted = true;
      }
    });
  </script>
</body>
</html>
