<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Приветик</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #start-block {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    #start-btn {
      max-width: 100%;
      padding: 18px 32px;
      border: 0;
      border-radius: 16px;
      background: #23a6d5;
      color: #fff;
      box-shadow: 0 4px 24px #0006;
      font: inherit;
      font-size: clamp(1.25rem, 5vw, 2rem);
      cursor: pointer;
    }

    #main-content {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    #rickroll {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="start-block">
    <button id="start-btn" type="button">Хочу нажать</button>
  </div>

  <main id="main-content">
    <video id="rickroll" controls playsinline>
      <source src="video.mp4" type="video/mp4">
      Ваш браузер не поддерживает видео.
    </video>
  </main>

  <script>
    const startBlock = document.getElementById('start-block');
    const mainContent = document.getElementById('main-content');
    const video = document.getElementById('rickroll');

    document.getElementById('start-btn').addEventListener('click', async () => {
      startBlock.remove();
      mainContent.style.display = 'block';

      try {
        await video.play();
      } catch (error) {
        // Если браузер не разрешит автозапуск, останется доступна кнопка Play в плеере.
      }
    });
  </script>
</body>
</html>
